name: karbi-test

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: karbi_test
      POSTGRES_USER: karbi
      POSTGRES_PASSWORD: karbi
    ports:
      - "${TEST_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karbi -d karbi_test"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${TEST_REDIS_PORT:-56380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
