name: karbi

# Production-first compose file: secrets have no fallbacks and the environment
# defaults to "production" so validate_runtime_secrets() is active. For local
# runs pass the dev defaults explicitly: docker compose --env-file deploy/dev.env ...
# (the `just compose-up` recipe already does).

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - proxy

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - proxy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment: &application-environment
      CONFIG_PATH: /app/backend/shared/settings/config.docker.yaml
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      DB_USER: ${DB_USER:-karbi}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env - no default in production}
      DB_NAME: ${DB_NAME:-karbi}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env - no default in production}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-30}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_TENANT_ID: ${S3_TENANT_ID:-}
      S3_KEY_ID: ${S3_KEY_ID:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ru-central-1}
      S3_VERIFY_TLS: ${S3_VERIFY_TLS:-true}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - no default in production}
      CREDENTIALS_ENCRYPTION_KEYS: ${CREDENTIALS_ENCRYPTION_KEYS:?set CREDENTIALS_ENCRYPTION_KEYS in .env - no default in production}
      CREDENTIALS_FINGERPRINT_KEY: ${CREDENTIALS_FINGERPRINT_KEY:?set CREDENTIALS_FINGERPRINT_KEY in .env - no default in production}
      WB_FEEDBACK_PAGE_SIZE: ${WB_FEEDBACK_PAGE_SIZE:-5000}
      # The relay outside Russia is the only way to the messenger. The secret is
      # shared with it; the bot tokens themselves never come back here.
      RELAY_BASE_URL: ${RELAY_BASE_URL:?set RELAY_BASE_URL in .env}
      RELAY_JWT_SECRET: ${RELAY_JWT_SECRET:?set RELAY_JWT_SECRET in .env - no default in production}
      RELAY_VERIFY: ${RELAY_VERIFY:-/etc/relay/relay.crt}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - ./relay-tls:/etc/relay:ro
    extra_hosts:
      - "${RELAY_HOST_NAME:?set RELAY_HOST_NAME in .env}:${RELAY_HOST_IP:?set RELAY_HOST_IP in .env}"
    networks:
      - proxy
      - internal

  wb-reviews-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    command: ["python", "-m", "backend.workers.wb_reviews.main"]
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    # The worker main loop must call backend.shared.heartbeat.touch_heartbeat()
    # at least every 15 minutes, otherwise the container is reported unhealthy.
    healthcheck: &worker-healthcheck
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat 2>/dev/null || echo 0) )) -lt 900"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 300s
    networks:
      - internal
      - egress

  wb-turnover-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    command: ["python", "-m", "backend.workers.wb_turnover.main"]
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck: *worker-healthcheck
    networks:
      - internal
      - egress

  notifications-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    # Exactly one replica: Telegram refuses a second getUpdates on the same token.
    command: ["python", "-m", "backend.workers.notifications.main"]
    volumes:
      - ./relay-tls:/etc/relay:ro
    extra_hosts:
      - "${RELAY_HOST_NAME:?set RELAY_HOST_NAME in .env}:${RELAY_HOST_IP:?set RELAY_HOST_IP in .env}"
    environment:
      <<: *application-environment
      # api.telegram.org is blocked upstream of some hosts, this one included.
      # httpx trusts the environment, so setting TELEGRAM_HTTPS_PROXY in .env
      # sends Telegram calls through a proxy with no code change; left empty the
      # variable is ignored and nothing is proxied. This worker speaks HTTP to
      # nobody but Telegram, so the proxy can never touch Wildberries traffic.
      HTTPS_PROXY: ${TELEGRAM_HTTPS_PROXY:-}
      NO_PROXY: ${TELEGRAM_NO_PROXY:-db,redis,kafka,localhost,127.0.0.1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck: *worker-healthcheck
    networks:
      - internal
      - egress

  outbox-publisher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    mem_limit: 384m
    command: ["python", "-m", "backend.workers.outbox.main"]
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    healthcheck: *worker-healthcheck
    networks:
      - internal

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: "no"
    mem_limit: 256m
    command:
      - /bin/sh
      - -c
      - alembic -n platform upgrade head && alembic -n wb_core upgrade head && alembic -n wb_reviews upgrade head && alembic -n notifications upgrade head && alembic -n wb_turnover upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-karbi}:${DB_PASSWORD:?set DB_PASSWORD in .env - no default in production}@db:5432/${DB_NAME:-karbi}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - effective_cache_size=1GB
    environment:
      POSTGRES_DB: ${DB_NAME:-karbi}
      POSTGRES_USER: ${DB_USER:-karbi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env - no default in production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-karbi} -d ${DB_NAME:-karbi}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  pg-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    entrypoint: ["/bin/sh", "/pg-backup.sh"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${DB_USER:-karbi}
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env - no default in production}
      PGDATABASE: ${DB_NAME:-karbi}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./pg-backup.sh:/pg-backup.sh:ro
      - postgres_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    # Unhealthy when the newest dump is older than ~25 hours (1500 minutes).
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'karbi-*.dump' -mmin -1500 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 10m
    networks:
      - internal

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env - no default in production}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env - no default in production} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_RETENTION_BYTES: 2147483648
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - internal

volumes:
  postgres_data:
  postgres_backups:
  redis_data:
  kafka_data:

networks:
  proxy:
  internal:
    internal: true
  egress:
