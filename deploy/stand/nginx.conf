events {
    worker_connections 256;
}

# Стенд: один адрес для кабинета (localhost:8090) и админки (admin.localhost:8090). Фронт сам решает по
# имени хоста, что показывать (frontend/src/features/admin/entry.ts), а Chrome резолвит *.localhost в
# 127.0.0.1, поэтому отдельный server и запись в /etc/hosts не нужны.
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost admin.localhost 127.0.0.1 _;
        client_max_body_size 25m;

        set $stand_api http://api:8000;
        set $stand_frontend http://frontend:80;

        location /api/ {
            proxy_pass $stand_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass $stand_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
        }
    }
}
