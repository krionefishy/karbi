server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Хешированные имена меняются с каждой сборкой, поэтому кешировать их можно
    # навсегда. `=404` здесь важнее кеша: без него отсутствующий бандл проваливался
    # бы в общий try_files и возвращался как index.html с кодом 200 — браузер
    # получал HTML вместо скрипта и показывал белый экран вместо внятной ошибки.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # А вот сам index.html кешировать нельзя ни секунды: он единственный, кто
    # знает актуальные имена бандлов. Закешированная копия переживает деплой и
    # ссылается на файлы, которых уже нет.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
