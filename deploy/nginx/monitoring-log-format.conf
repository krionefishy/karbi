# Формат лога для мониторинга: кладётся в /etc/nginx/conf.d скриптом
# render-hosts.sh. Значения application и environment обязаны совпадать с
# deploy/monitoring/application.json — строки с другими сборщик отбрасывает.
#
# Путь берётся из $request_uri без строки запроса: в запросе бывают токены,
# а $uri не годится, потому что уже переписан.
map $request_uri $monitor_path {
    ~^(?<path_without_query>[^?]*) $path_without_query;
}
# В лог мониторинга не пишутся (в обычном access.log остаются):
# - запрос, который nginx не смог разобрать (сканер, TLS на открытом порту): до
#   приложения он не доходит и пути не имеет, мониторинг считал бы строку испорченной;
# - 410 расширению «Возвраты WB»: установку отозвали (кабинет подключили в другом
#   браузере), а брошенный браузер старой сборки стучится раз в 5 минут вечно.
#   Это не сбой сервиса; 401 (чужой токен) по-прежнему пишется.
map "$status:$request_uri" $monitor_loggable {
    ~^[0-9]+:$ 0;
    ~^410:/api/v1/wb/returns/extension/ 0;
    default 1;
}
log_format monitoring_json escape=json
    '{"schema_version":"1",'
    '"application":"marketplace-auto","environment":"production",'
    '"msec":"$msec","request_id":"$request_id",'
    '"method":"$request_method","path":"$monitor_path",'
    '"status":"$status","request_time":"$request_time",'
    '"upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"bytes_sent":"$bytes_sent"}';
