# Админка. Тот же бэкенд и тот же SPA, что и на основном домене, — отдельный
# только вход: на marketplace-auto.ru префикс /api/v1/admin/ закрыт, и открыть
# раздел можно лишь отсюда. Права всё равно проверяются в базе на каждый запрос,
# поэтому это второй рубеж, а не единственный.

server {
    listen 80;
    listen [::]:80;
    server_name admin.marketplace-auto.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.marketplace-auto.ru;

    ssl_certificate /etc/letsencrypt/live/admin.marketplace-auto.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.marketplace-auto.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Раскомментировать, когда появится постоянный адрес: сетевой рубеж дешевле
    # любой проверки внутри приложения.
    # allow 203.0.113.7;
    # deny all;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Внутренний контур: сюда ходит только релей, и только через свой
    # listener на 8443. Через публичные адреса — никогда, ни на одном домене.
    location ^~ /api/v1/internal/ {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
