# Единственный вход для релея: апдейты из мессенджера приходят сюда.
#
# Этот listener не публичный. Он висит на нестандартном порту, пускает один
# адрес и отдаёт только префикс /api/v1/internal/, который на публичных
# vhost'ах закрыт наглухо. JWT в приложении — второй рубеж, не первый.
#
# Сертификат самоподписанный: релей пиннит именно его, публичный УЦ здесь не
# нужен и оставил бы след в Certificate Transparency.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name main.marketplace-auto.internal;

    ssl_certificate     /etc/relay/tls/main.crt;
    ssl_certificate_key /etc/relay/tls/main.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Сетевой рубеж: адрес VPS с релеем и больше никто.
    allow 45.12.255.184;
    deny all;

    client_max_body_size 256k;

    # Тела запросов не логируются: в них то, что люди пишут боту.
    access_log /var/log/nginx/relay-inbound.access.log;
    error_log /var/log/nginx/relay-inbound.error.log warn;

    # Ровно один префикс. Всё остальное на этом порту не существует.
    location ^~ /api/v1/internal/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 404;
    }
}
