name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  # deploy.yaml verifies CI check runs for the deployed SHA; a called workflow
  # cannot request more than its caller grants.
  checks: read

concurrency:
  group: main-ci-cd
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  deploy:
    needs: ci
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit
