name: CD

on:
  workflow_call:
    secrets:
      SSH_HOST:
        required: true
      SSH_USERNAME:
        required: true
      SSH_PORT:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSH_FINGERPRINT:
        required: true
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # A manual workflow_dispatch would otherwise deploy any SHA without CI ever
  # having looked at it. Require completed, successful "ci / *" check runs for
  # the exact commit before the deploy job may start. When this workflow is
  # called from the orchestrator, CI already ran as a required upstream job.
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a green CI run for the deployed SHA
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Called from the orchestrator after CI succeeded; nothing to verify."
            exit 0
          fi
          # Job names of the reusable CI workflow appear as "ci / <job>" check runs.
          checks=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate \
            --jq '[.check_runs[] | select(.name | startswith("ci / "))]')
          total=$(echo "$checks" | jq 'length')
          green=$(echo "$checks" | jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')
          echo "CI check runs for $SHA: $green successful of $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::No CI check runs found for $SHA. Push it through CI before deploying." >&2
            exit 1
          fi
          if [ "$green" -ne "$total" ]; then
            echo "$checks" | jq -r '.[] | "\(.name): \(.status)/\(.conclusion)"'
            echo "::error::CI is not green for $SHA; refusing to deploy." >&2
            exit 1
          fi

  deploy:
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Deploy tested revision
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_FINGERPRINT }}
          envs: DEPLOY_SHA
          command_timeout: 25m
          script: |
            set -eu

            cd /opt/karbi/app
            test -f .env

            git fetch --prune origin main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            git merge-base --is-ancestor "${DEPLOY_SHA}" origin/main
            git checkout --force main
            git reset --hard "${DEPLOY_SHA}"

            sudo docker compose --env-file .env -f deploy/compose.yaml build
            sudo docker compose --env-file .env -f deploy/compose.yaml up -d --remove-orphans

            ready=false
            for attempt in $(seq 1 36); do
              if curl --fail --silent --show-error --max-time 5 \
                http://127.0.0.1:8080/api/v1/health/ready >/dev/null; then
                ready=true
                break
              fi
              sleep 5
            done

            if [ "$ready" != "true" ]; then
              sudo docker compose --env-file .env -f deploy/compose.yaml ps
              sudo docker compose --env-file .env -f deploy/compose.yaml logs \
                --tail=200 migrate api wb-reviews-worker wb-turnover-worker notifications-worker outbox-publisher nginx
              exit 1
            fi

            test "$(sudo docker compose --env-file .env -f deploy/compose.yaml \
              ps --status running -q wb-reviews-worker | wc -l | tr -d ' ')" = "1"
            test "$(sudo docker compose --env-file .env -f deploy/compose.yaml \
              ps --status running -q outbox-publisher | wc -l | tr -d ' ')" = "1"
            test "$(sudo docker compose --env-file .env -f deploy/compose.yaml \
              ps --status running -q notifications-worker | wc -l | tr -d ' ')" = "1"
            test "$(sudo docker compose --env-file .env -f deploy/compose.yaml \
              ps --status running -q wb-turnover-worker | wc -l | tr -d ' ')" = "1"

            sudo docker compose --env-file .env -f deploy/compose.yaml ps
            sudo docker image prune --force
