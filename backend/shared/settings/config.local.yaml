app:
  environment: local
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  cors_origins: []
  trust_proxy_headers: false
database:
  host: localhost
  port: 5432
  user: karbi
  password: karbi
  database: karbi
redis:
  host: localhost
  port: 6379
  database: 0
  password: ""
kafka:
  enabled: false
  bootstrap_servers: localhost:9092
  consumer_group: karbi
  topic_partitions: 3
  topic_replication_factor: 1
s3:
  enabled: false
auth:
  jwt_secret: change-me
  issuer: karbi
  audience: karbi-api
  access_token_ttl_seconds: 86400
  refresh_token_ttl_seconds: 604800
rate_limit:
  enabled: true
  requests: 120
  window_seconds: 60
worker:
  poll_interval_seconds: 30
  review_sync_hour: 0
  review_sync_minute: 30
  review_sync_timezone: Europe/Moscow
  feedback_page_size: 5000
  job_lease_seconds: 1800
  job_max_attempts: 3
  job_retry_backoff_seconds: 300
  run_max_age_seconds: 21600
egress:
  base_url: ${EGRESS_URL:-http://localhost:8090}
  jwt_secret: ${EGRESS_JWT_SECRET:-local-egress-secret}
  verify: ${EGRESS_VERIFY:-false}
telegram:
  api_base_url: https://api.telegram.org
  invite_link_ttl_hours: 72
relay:
  base_url: http://localhost:8081
  jwt_secret: local-development-relay-secret-not-a-real-one
  verify: "false"
