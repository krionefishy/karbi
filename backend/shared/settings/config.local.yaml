app:
  environment: local
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  cors_origins: []
  trust_proxy_headers: false
database:
  host: localhost
  port: 5432
  user: karbi
  password: karbi
  database: karbi
redis:
  host: localhost
  port: 6379
  database: 0
  password: ""
kafka:
  enabled: false
  bootstrap_servers: localhost:9092
  consumer_group: karbi
  topic_partitions: 3
  topic_replication_factor: 1
s3:
  enabled: false
auth:
  jwt_secret: change-me
  issuer: karbi
  audience: karbi-api
  access_token_ttl_seconds: 86400
  refresh_token_ttl_seconds: 604800
security:
  credential_encryption_keys: []
  credential_fingerprint_key: ""
rate_limit:
  enabled: true
  requests: 30
  window_seconds: 60
worker:
  poll_interval_seconds: 30
  review_sync_hour: 0
  review_sync_minute: 30
  review_sync_timezone: Europe/Moscow
  feedback_page_size: 5000
  feedback_request_interval_seconds: 0.0
  feedback_retry_wait_seconds: 600
  job_lease_seconds: 1800
  job_max_attempts: 3
  job_retry_backoff_seconds: 300
  run_max_age_seconds: 21600
wb_api:
  window_seconds: 60
  content_per_key: 90
  content_per_host: 90
  feedbacks_per_key: 55
  feedbacks_per_host: 55
  max_wait_seconds: 120
