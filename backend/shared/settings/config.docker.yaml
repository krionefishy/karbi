app:
  environment: ${APP_ENVIRONMENT:-docker}
  host: 0.0.0.0
  port: 8000
  log_level: ${APP_LOG_LEVEL:-INFO}
  cors_origins: []
  trust_proxy_headers: true
database:
  host: db
  port: 5432
  user: ${DB_USER:-karbi}
  password: ${DB_PASSWORD:-karbi}
  database: ${DB_NAME:-karbi}
redis:
  host: redis
  port: 6379
  database: 0
  password: ${REDIS_PASSWORD:-karbi}
kafka:
  enabled: ${KAFKA_ENABLED:-true}
  bootstrap_servers: kafka:9092
  consumer_group: karbi
  topic_partitions: 3
  topic_replication_factor: 1
s3:
  enabled: ${S3_ENABLED:-false}
  endpoint_url: ${S3_ENDPOINT_URL:-}
  tenant_id: ${S3_TENANT_ID:-}
  key_id: ${S3_KEY_ID:-}
  secret_key: ${S3_SECRET_KEY:-}
  bucket: ${S3_BUCKET:-}
  region: ${S3_REGION:-ru-central-1}
  verify_tls: ${S3_VERIFY_TLS:-true}
auth:
  jwt_secret: ${JWT_SECRET:-change-me}
  algorithm: HS256
  issuer: karbi
  audience: karbi-api
  access_token_ttl_seconds: 86400
  refresh_token_ttl_seconds: 604800
rate_limit:
  enabled: true
  requests: ${RATE_LIMIT_REQUESTS:-120}
  window_seconds: ${RATE_LIMIT_WINDOW_SECONDS:-60}
export:
  # Separate machine credentials; both slots may coexist during rotation.
  token: ${EXPORT_TOKEN:-}
  token_next: ${EXPORT_TOKEN_NEXT:-}
  # Comma-separated IPs/CIDRs. Production contains only vm-bridge.
  allowed_ips: ${EXPORT_ALLOWED_IPS:-}
worker:
  poll_interval_seconds: 30
  review_sync_hour: 0
  review_sync_minute: 30
  review_sync_timezone: Europe/Moscow
  feedback_page_size: ${WB_FEEDBACK_PAGE_SIZE:-5000}
  job_lease_seconds: 1800
  job_max_attempts: 3
  job_retry_backoff_seconds: 300
  run_max_age_seconds: 21600
egress:
  base_url: ${EGRESS_URL:-}
  jwt_secret: ${EGRESS_JWT_SECRET:-}
  verify: ${EGRESS_VERIFY:-/etc/egress/egress.crt}
  jwt_ttl_seconds: ${EGRESS_JWT_TTL_SECONDS:-300}
  request_timeout_seconds: ${EGRESS_REQUEST_TIMEOUT_SECONDS:-200}
telegram:
  api_base_url: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
  poll_timeout_seconds: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-25}
  request_timeout_seconds: ${TELEGRAM_REQUEST_TIMEOUT_SECONDS:-40}
  bot_refresh_seconds: ${TELEGRAM_BOT_REFRESH_SECONDS:-60}
  delivery_interval_seconds: ${TELEGRAM_DELIVERY_INTERVAL_SECONDS:-1.0}
  send_max_attempts: ${TELEGRAM_SEND_MAX_ATTEMPTS:-5}
  send_retry_backoff_seconds: ${TELEGRAM_SEND_RETRY_BACKOFF_SECONDS:-30}
  invite_link_ttl_hours: ${TELEGRAM_INVITE_LINK_TTL_HOURS:-72}
relay:
  base_url: ${RELAY_BASE_URL:-}
  jwt_secret: ${RELAY_JWT_SECRET:-}
  issuer: ${RELAY_ISSUER:-marketplace-auto}
  audience: ${RELAY_AUDIENCE:-relay}
  jwt_ttl_seconds: ${RELAY_JWT_TTL_SECONDS:-300}
  updates_wait_seconds: ${RELAY_UPDATES_WAIT_SECONDS:-25}
  photos_enabled: ${RELAY_PHOTOS_ENABLED:-true}
  file_timeout_seconds: ${RELAY_FILE_TIMEOUT_SECONDS:-120}
  verify: ${RELAY_VERIFY:-/etc/relay/relay.crt}
  request_timeout_seconds: ${RELAY_REQUEST_TIMEOUT_SECONDS:-60}
turnover:
  timezone: Europe/Moscow
  stock_slot_hours: [3, 9, 15, 21]
  orders_hour: 3
  orders_minute: 20
  calculation_hour: 3
  calculation_minute: 40
  digest_hour: ${TURNOVER_DIGEST_HOUR:-10}
  digest_minute: 0
  orders_window_days: ${TURNOVER_ORDERS_WINDOW_DAYS:-3}
  orders_backfill_days: 8
  orders_overlap_hours: 24
  threshold_days: ${TURNOVER_THRESHOLD_DAYS:-10}
  min_photos: ${TURNOVER_MIN_PHOTOS:-3}
  snapshot_retention_days: 60
  order_retention_days: 45
  notification_bot: ${TURNOVER_NOTIFICATION_BOT:-turnover-alerts}

fbs_distribution:
  timezone: Europe/Moscow
  # Токен входящего обмена с 1С. Пустой — обмен выключен, эндпоинт отвечает 503.
  onec_token: ${ONEC_TOKEN:-}
returns:
  timezone: Europe/Moscow
  poll_minutes: ${RETURNS_POLL_MINUTES:-10}
  retry_minutes: 5
  report_window_days: 14
  report_backfill_days: 31
  claims_archive_hours: 6
  notify_hours: [9, 12, 15, 18]
  notification_bot: ${RETURNS_NOTIFICATION_BOT:-wb-returns}
  history_limit: 300
  public_base_url: https://${PUBLIC_DOMAIN:-localhost}
  extension_download_path: /extension/marketplace-auto-returns.zip
  pairing_ttl_minutes: 15
  code_alert_hour: 1
  install_silent_hours: 24

card_documents:
  timezone: Europe/Moscow
  # Каждый проход читает только изменённые карточки (курсор по updatedAt с запасом);
  # полный обход — раз в full_interval_hours, только он видит карточки, ушедшие из каталога.
  interval_minutes: 60
  full_interval_hours: 24
  cursor_margin_seconds: 60
  retry_minutes: 30
  stale_hours: 9
  expiry_thresholds: [30, 14, 7]
  digest_hour: 10
  digest_minute: 0
  # Плановый сбор не стартует в окна каталога (02:30) и чек-листа (05:00): бюджет «Контента» общий.
  skip_hours: [2, 5]
  notification_bot: ${CARD_DOCUMENTS_NOTIFICATION_BOT:-card-documents}
  # Уведомления только по карточкам с остатком FBO + FBS (зеркало wb_core) не меньше порога;
  # зеркало старше stock_fresh_hours — остаток неизвестен, уведомление не подавляется.
  min_stock_for_alerts: 1
  stock_fresh_hours: 48

support_bot:
  # off | enforce: как вердикт нейросети влияет на отправку (off — не влияет).
  classifier_mode: ${SUPPORT_BOT_CLASSIFIER_MODE:-enforce}
  classifier_prompt_version: v2
  # off | enforce: слой ответов покупателей. enforce — класс ответа решает, продолжать ли рассылку;
  # off — любой ответ покупателя останавливает кампанию.
  reply_gate_mode: ${SUPPORT_BOT_REPLY_GATE_MODE:-enforce}
  # Метка версии промпта в журнале вердиктов: по ней считаются срезы и метрики и строится
  # уникальный ключ среза. Смена движка требует новой метки, иначе вердикты панели смешаются
  # с вердиктами одной модели. Не длиннее 16 символов (колонка prompt_version).
  reply_prompt_version: ${SUPPORT_BOT_REPLY_PROMPT_VERSION:-r3}
  # single | panel: кто решает по ответу. single — одна модель из `llm`; panel — слой принятия решения:
  # два судьи, при расхождении арбитр, затем резервный арбитр. Смена движка требует новой reply_prompt_version.
  reply_engine: ${SUPPORT_BOT_REPLY_ENGINE:-single}
  reply_judge_a_model: Qwen/Qwen3.6-35B-A3B
  reply_judge_a_max_tokens: 150
  reply_judge_b_model: openai/gpt-oss-120b
  reply_judge_b_max_tokens: 400
  reply_judge_b_reasoning_effort: low
  reply_arbiter_model: deepseek-ai/DeepSeek-V4-Flash
  reply_arbiter_max_tokens: 1500
  reply_reserve_model: z-ai/glm-4.5-air
  reply_reserve_max_tokens: 1500
  # Пороги карточек панели решений во вкладке «Состояние». Замер на проде 05.11.2026 за 7 дней:
  # 32 решения панели, расхождений судей 0, арбитр 1 (3%), резерва и degraded нет.
  # A/B обещал 8–22% расхождений — живые промпты d2 сходятся заметно чаще. Правятся здесь без правки кода.
  panel:
    window_days: 7
    min_sample: 20
    # Расхождение судей по действию: на проде 0% из 31 решения, где ответили оба судьи.
    disagree_warn_percent: 15
    disagree_crit_percent: 25
    # Доля решений, где звали арбитра (расхождение или молчание судьи): на проде 3%.
    # Знаменатель больше, чем у расхождения: сюда попадают и решения с молчащим судьёй.
    arbiter_warn_percent: 20
    arbiter_crit_percent: 30
    # Резерв = основной арбитр не ответил.
    reserve_warn_percent: 5
    reserve_crit_percent: 20
    # degraded = диалог держится без отправки, потому что не ответил ни один арбитр.
    degraded_warn: 1
    degraded_crit: 3

llm:
  # Модель меняется здесь: правка строки и перераскатка. Ключ — только из окружения.
  base_url: ${LLM_BASE_URL:-https://foundation-models.api.cloud.ru/v1}
  model: ${LLM_MODEL:-Qwen/Qwen3.6-35B-A3B}
  # Qwen3.6 без этого рассуждает и на 150 токенах отдаёт пустой ответ. Замер 08.11.2026 на 40 хвостах:
  # с выключенными рассуждениями 38 из 40 вердиктов совпали с прежней Qwen3-30B-A3B, медиана вызова 0,5 с.
  enable_thinking: ${LLM_ENABLE_THINKING:-false}
  api_key: ${FOUNDATION_MODELS_API_KEY:-}
  timeout_seconds: 60
  max_tokens: 150
  temperature: 0

screenshot_control:
  # off | shadow | enforce. shadow: вердикты пишутся, KPI помечен как предварительный.
  mode: ${SCREENSHOT_CONTROL_MODE:-shadow}
  # Дата начала боевого KPI (YYYY-MM-DD); раньше неё цифры предварительные.
  kpi_from: ${SCREENSHOT_CONTROL_KPI_FROM:-}
  timezone: Europe/Moscow
  poll_seconds: 2
  # Ключ HMAC для имён покупателей, 32+ символов: без него при mode != off модуль выключается сам.
  hmac_key: ${SCREENSHOT_CONTROL_HMAC_KEY:-}
  # Отдельный бакет под скрины (ПДн, свой lifecycle); пусто — общий s3.bucket с префиксом dbs-screenshots/.
  s3_bucket: ${SCREENSHOT_CONTROL_S3_BUCKET:-}
  staging_root: ${SCREENSHOT_CONTROL_STAGING:-/data/screenshots-staging}
  staging_max_used_percent: 85
  # Предел самого каталога staging (2 ГБ): без S3 файлы копятся здесь, а том общий с базой.
  staging_max_bytes: 2147483648
  staging_stale_minutes: 15
  max_upload_bytes: 15728640
  min_side_px: 500
  # Реальные скрины до 6K Retina — около 20 Мпикс; больше — память api (512 МБ) под угрозой.
  max_image_pixels: 25000000
  retention_original_days: 365
  retention_thumb_days: 365
  retention_fields_days: 1095
  purge_hour: 4
  purge_minute: 10
  dedupe_window_days: 90
  outcome_ttl_hours: 24
  late_upload_hours: 72
  clock_skew_minutes: 15
  review_age_max_days: 120
  burst_per_hour: 60
  uploads_per_minute: 20
  uploads_per_hour: 120
  status_polls_per_minute: 120
  extraction_max_attempts: 4
  audit_percent: ${SCREENSHOT_CONTROL_AUDIT_PERCENT:-4.0}
  thresholds:
    text_dup: 0.90
    text_maybe: 0.75
    min_text_len: 25
    vlm_ocr_text: 0.80
    near_dhash_strict: 6
    near_tile_strict: 0.97
    near_dhash_soft: 12
    near_tile_soft: 0.90
  image_url_ttl_seconds: 300
  pairing_ttl_minutes: 15
  # Жёсткий лимит на обмен кода сопряжения: с одного IP не больше N попыток за окно.
  pair_attempts_per_window: 10
  pair_window_seconds: 600
  extension_token_idle_days: 60
  link_token_ttl_minutes: 15
  notification_bot: ${SCREENSHOT_CONTROL_BOT:-screens}
  pipeline_version: v1
  public_base_url: https://${PUBLIC_DOMAIN:-localhost}
  extension_download_path: /extension/marketplace-auto-screenshots.zip
  extension_min_version: 0.1.0
  allowed_url_prefixes: ["https://seller.wildberries.ru/chat-with-clients"]

vision:
  # Модель для скриншотов, отдельно от текстовой llm; выбрана пробным прогоном, рассуждения выключены.
  base_url: ${LLM_BASE_URL:-https://foundation-models.api.cloud.ru/v1}
  model: ${VISION_MODEL:-Qwen/Qwen3.6-35B-A3B}
  fallback_model: ${VISION_FALLBACK_MODEL:-Qwen/Qwen3.5-397B-A17B}
  enable_thinking: false
  api_key: ${FOUNDATION_MODELS_API_KEY:-}
  timeout_seconds: 60
  max_tokens: 1200
  temperature: 0
  max_image_side: 2000
