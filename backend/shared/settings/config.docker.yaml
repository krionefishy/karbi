app:
  environment: ${APP_ENVIRONMENT:-docker}
  host: 0.0.0.0
  port: 8000
  log_level: ${APP_LOG_LEVEL:-INFO}
  cors_origins: []
  trust_proxy_headers: true
database:
  host: db
  port: 5432
  user: ${DB_USER:-karbi}
  password: ${DB_PASSWORD:-karbi}
  database: ${DB_NAME:-karbi}
redis:
  host: redis
  port: 6379
  database: 0
  password: ${REDIS_PASSWORD:-karbi}
kafka:
  enabled: ${KAFKA_ENABLED:-true}
  bootstrap_servers: kafka:9092
  consumer_group: karbi
  topic_partitions: 3
  topic_replication_factor: 1
s3:
  enabled: ${S3_ENABLED:-false}
  endpoint_url: ${S3_ENDPOINT_URL:-}
  tenant_id: ${S3_TENANT_ID:-}
  key_id: ${S3_KEY_ID:-}
  secret_key: ${S3_SECRET_KEY:-}
  bucket: ${S3_BUCKET:-}
  region: ${S3_REGION:-ru-central-1}
  verify_tls: ${S3_VERIFY_TLS:-true}
auth:
  jwt_secret: ${JWT_SECRET:-change-me}
  algorithm: HS256
  issuer: karbi
  audience: karbi-api
  access_token_ttl_seconds: 86400
  refresh_token_ttl_seconds: 604800
rate_limit:
  enabled: true
  requests: ${RATE_LIMIT_REQUESTS:-120}
  window_seconds: ${RATE_LIMIT_WINDOW_SECONDS:-60}
worker:
  poll_interval_seconds: 30
  review_sync_hour: 0
  review_sync_minute: 30
  review_sync_timezone: Europe/Moscow
  feedback_page_size: ${WB_FEEDBACK_PAGE_SIZE:-5000}
  job_lease_seconds: 1800
  job_max_attempts: 3
  job_retry_backoff_seconds: 300
  run_max_age_seconds: 21600
egress:
  base_url: ${EGRESS_URL:-}
  jwt_secret: ${EGRESS_JWT_SECRET:-}
  verify: ${EGRESS_VERIFY:-/etc/egress/egress.crt}
  jwt_ttl_seconds: ${EGRESS_JWT_TTL_SECONDS:-300}
  request_timeout_seconds: ${EGRESS_REQUEST_TIMEOUT_SECONDS:-200}
telegram:
  api_base_url: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
  poll_timeout_seconds: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-25}
  request_timeout_seconds: ${TELEGRAM_REQUEST_TIMEOUT_SECONDS:-40}
  bot_refresh_seconds: ${TELEGRAM_BOT_REFRESH_SECONDS:-60}
  delivery_interval_seconds: ${TELEGRAM_DELIVERY_INTERVAL_SECONDS:-1.0}
  send_max_attempts: ${TELEGRAM_SEND_MAX_ATTEMPTS:-5}
  send_retry_backoff_seconds: ${TELEGRAM_SEND_RETRY_BACKOFF_SECONDS:-30}
  invite_link_ttl_hours: ${TELEGRAM_INVITE_LINK_TTL_HOURS:-72}
relay:
  base_url: ${RELAY_BASE_URL:-}
  jwt_secret: ${RELAY_JWT_SECRET:-}
  issuer: ${RELAY_ISSUER:-marketplace-auto}
  audience: ${RELAY_AUDIENCE:-relay}
  jwt_ttl_seconds: ${RELAY_JWT_TTL_SECONDS:-300}
  updates_wait_seconds: ${RELAY_UPDATES_WAIT_SECONDS:-25}
  photos_enabled: ${RELAY_PHOTOS_ENABLED:-true}
  verify: ${RELAY_VERIFY:-/etc/relay/relay.crt}
  request_timeout_seconds: ${RELAY_REQUEST_TIMEOUT_SECONDS:-60}
turnover:
  timezone: Europe/Moscow
  stock_slot_hours: [3, 9, 15, 21]
  orders_hour: 3
  orders_minute: 20
  calculation_hour: 3
  calculation_minute: 40
  digest_hour: ${TURNOVER_DIGEST_HOUR:-10}
  digest_minute: 0
  orders_window_days: ${TURNOVER_ORDERS_WINDOW_DAYS:-3}
  orders_backfill_days: 8
  orders_overlap_hours: 24
  threshold_days: ${TURNOVER_THRESHOLD_DAYS:-10}
  min_photos: ${TURNOVER_MIN_PHOTOS:-3}
  snapshot_retention_days: 60
  order_retention_days: 45
  notification_bot: ${TURNOVER_NOTIFICATION_BOT:-turnover-alerts}

fbs_distribution:
  timezone: Europe/Moscow
  # Токен входящего обмена с 1С. Пустой — обмен выключен, эндпоинт отвечает 503.
  onec_token: ${ONEC_TOKEN:-}
returns:
  timezone: Europe/Moscow
  poll_minutes: ${RETURNS_POLL_MINUTES:-10}
  retry_minutes: 5
  report_window_days: 14
  report_backfill_days: 31
  claims_archive_hours: 6
  notify_hours: [9, 12, 15, 18]
  notification_bot: ${RETURNS_NOTIFICATION_BOT:-wb-returns}
  history_limit: 300
  public_base_url: https://${PUBLIC_DOMAIN:-localhost}
  extension_download_path: /extension/marketplace-auto-returns.zip
  pairing_ttl_minutes: 15
  code_alert_hour: 1
  install_silent_hours: 24

card_documents:
  timezone: Europe/Moscow
  # Каждый проход читает только изменённые карточки (курсор по updatedAt с запасом);
  # полный обход — раз в full_interval_hours, только он видит карточки, ушедшие из каталога.
  interval_minutes: 60
  full_interval_hours: 24
  cursor_margin_seconds: 60
  retry_minutes: 30
  stale_hours: 9
  expiry_thresholds: [30, 14, 7]
  digest_hour: 10
  digest_minute: 0
  # Плановый сбор не стартует в окна каталога (02:30) и чек-листа (05:00): бюджет «Контента» общий.
  skip_hours: [2, 5]
  notification_bot: ${CARD_DOCUMENTS_NOTIFICATION_BOT:-card-documents}
  # Уведомления только по карточкам с остатком FBO + FBS (зеркало wb_core) не меньше порога;
  # зеркало старше stock_fresh_hours — остаток неизвестен, уведомление не подавляется.
  min_stock_for_alerts: 1
  stock_fresh_hours: 48

support_bot:
  # off | shadow | enforce: как вердикт нейросети влияет на отправку (shadow — только записываем).
  classifier_mode: ${SUPPORT_BOT_CLASSIFIER_MODE:-enforce}
  classifier_prompt_version: v2
  # off | shadow | enforce: слой ответов покупателей. enforce — класс ответа решает, продолжать ли рассылку;
  # shadow — классы считаются и пишутся, рассылка не меняется.
  reply_gate_mode: ${SUPPORT_BOT_REPLY_GATE_MODE:-enforce}
  reply_prompt_version: r2

llm:
  # Модель меняется здесь: правка строки и перераскатка. Ключ — только из окружения.
  base_url: ${LLM_BASE_URL:-https://foundation-models.api.cloud.ru/v1}
  model: ${LLM_MODEL:-Qwen/Qwen3-30B-A3B}
  api_key: ${FOUNDATION_MODELS_API_KEY:-}
  timeout_seconds: 60
  max_tokens: 150
  temperature: 0
