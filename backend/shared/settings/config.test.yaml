app:
  environment: test
  log_level: WARNING
database:
  host: localhost
  port: 55433
  user: karbi
  password: karbi
  database: karbi_test
redis:
  host: localhost
  port: 56380
  database: 0
kafka:
  enabled: false
  topic_partitions: 1
  topic_replication_factor: 1
s3:
  enabled: false
auth:
  jwt_secret: test-only-secret-at-least-32-characters
  issuer: karbi
  audience: karbi-api
rate_limit:
  enabled: false
worker:
  poll_interval_seconds: 1
  review_sync_hour: 0
  review_sync_minute: 30
  review_sync_timezone: Europe/Moscow
  feedback_page_size: 5000
  job_lease_seconds: 1800
  job_max_attempts: 3
  job_retry_backoff_seconds: 300
  run_max_age_seconds: 21600
egress:
  base_url: ${EGRESS_URL:-http://localhost:8090}
  jwt_secret: ${EGRESS_JWT_SECRET:-local-egress-secret}
  verify: ${EGRESS_VERIFY:-false}
telegram:
  # Tests never reach Telegram; the base URL is here so an accidental call fails loudly.
  api_base_url: http://telegram.invalid
  poll_timeout_seconds: 1
  request_timeout_seconds: 2
  bot_refresh_seconds: 1
  delivery_interval_seconds: 0.05
  send_max_attempts: 3
  send_retry_backoff_seconds: 1
  invite_link_ttl_hours: 72
relay:
  base_url: https://relay.invalid
  jwt_secret: test-relay-secret-that-is-long-enough
  verify: "false"
